[project]
name = "acadmcp-vision"
version = "0.2.0"
description = "AutoCAD MCP Vision sidecar - FastAPI HTTP API for OCR / vision LLM / YOLO / SAM."
requires-python = ">=3.11"
authors = [{ name = "AutoCAD MCP Megasystem" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anyio>=4.6",
    "httpx>=0.27",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    # Heavy deps installed on demand by setup-vision-models.ps1:
    #   "paddlepaddle", "paddleocr", "torch", "ultralytics", "segment-anything-2",
    #   "anthropic", "openai"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-protobuf",
]
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "paddlepaddle>=3.0.0b1",
    "paddleocr>=2.8",
    "anthropic>=0.39",
    "openai>=1.54",
    # Google Gemini 3.x vision (frontier model as of April 2026).
    "google-genai>=1.0",
]

[project.scripts]
acadmcp-vision = "acadmcp_vision.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acadmcp_vision"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
