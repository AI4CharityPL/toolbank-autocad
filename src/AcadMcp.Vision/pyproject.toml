[project]
name = "acadmcp-vision"
version = "0.2.0"
description = "AutoCAD MCP Vision sidecar - FastAPI HTTP API for OCR / vision LLM / YOLO / SAM."
requires-python = ">=3.11"
authors = [{ name = "Krzysztof Augiewicz and the ToolBank AutoCAD contributors" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anyio>=4.6",
    "httpx>=0.27",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    # Heavy deps are NOT installed here - see the [ml] extra and setup-vision-models.ps1.
    # Every one of them is resolved lazily via importlib at call time, so the core
    # install stays light and pulls in no ML stack. Engines degrade to a clear error
    # when their backend is absent.
    #   engines/ocr.py        -> paddleocr | easyocr | pytesseract (first one available)
    #   engines/yolo.py       -> ultralytics  (AGPL-3.0 - see THIRD-PARTY-NOTICES.md)
    #   engines/vision_llm.py -> anthropic | openai | google-genai
    # (_loaders.py also resolves pypdfium2 lazily, but that one IS a core dep above.)
]

[project.urls]
Homepage = "https://github.com/AI4CharityPL/toolbank-autocad"
Source = "https://github.com/AI4CharityPL/toolbank-autocad"
Issues = "https://github.com/AI4CharityPL/toolbank-autocad/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-protobuf",
]
# WARNING - licence: this extra pulls in ultralytics, which is AGPL-3.0, not MIT.
# acadmcp-vision itself is MIT and never imports ultralytics unless you install this
# extra: engines/yolo.py resolves it lazily via importlib at call time, so a default
# install links no AGPL code. Installing `[ml]` puts AGPL obligations on YOUR
# deployment. See THIRD-PARTY-NOTICES.md in the repository root.
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "paddlepaddle>=3.0.0b1",
    "paddleocr>=2.8",
    "anthropic>=0.39",
    "openai>=1.54",
    # Google Gemini 3.x vision (frontier model as of April 2026).
    "google-genai>=1.0",
]

[project.scripts]
acadmcp-vision = "acadmcp_vision.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acadmcp_vision"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
