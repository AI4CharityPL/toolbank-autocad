id: arch.doors.must-have-room-tag
name: Door blocks must carry a ROOM_FROM attribute
discipline: architectural
severity: warning
description: |
  Door BlockReferences must expose a non-empty ROOM_FROM attribute so that
  the door schedule generator and the BIM export can correlate each door with
  its host room. FIXED 2026-08-12: this rule checked a ROOM_NUMBER attribute
  that acad-openings.insert_door has never set - it writes ROOM_FROM/ROOM_TO,
  which is also what the door schedule's own CSV export reads. Every door
  placed by this bank's own door tool failed this rule unconditionally, even
  with roomFrom/roomTo correctly filled in - confirmed live before the fix.
scope:
  entity_types: [BlockReference]
checks:
  - type: any_of
    checks:
      - type: not
        check: { type: layer_matches, pattern: "^A-DOOR" }
      - type: all_of
        checks:
          - { type: attribute_present, tag: ROOM_FROM }
          - { type: attribute_value_matches, tag: ROOM_FROM, pattern: "^[A-Za-z0-9.-]+$" }
